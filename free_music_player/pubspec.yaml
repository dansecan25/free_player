name: free_music_player
description: "A personally created music player with no commercial interest at the moment."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  file_picker: ^9.0.2
  permission_handler: ^11.4.0
  sqflite: ^2.4.2
  audioplayers: ^6.5.0
  marquee: ^2.3.0
  just_audio: ^0.10.4
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  audio_metadata_reader: ^1.4.2
  dart_tags: ^0.4.1
  id3: ^1.0.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
